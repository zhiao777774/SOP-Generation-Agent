[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-generation-agent"
version = "0.1.0"
description = "Reviewable SOP draft generation agent with evidence planning and provenance artifacts."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "redis>=5.0.8",
  "rq>=1.16.2",
  "filelock>=3.15.4",
  "python-docx>=1.1.2",
  "pymupdf>=1.24.5",
  "openpyxl>=3.1.5",
  "bm25s>=0.3.8",
  "jieba>=0.42.1",
  "OpenCC>=1.1.9",
  "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]
ckip = [
  "ckiptagger>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py39"
